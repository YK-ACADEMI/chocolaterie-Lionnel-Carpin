const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const tokens=s=>norm(s).split(/[^a-z0-9]+/).filter(Boolean);
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++){for(let j=1;j<=n;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c)}}return d[m][n]}
function matchScore(text,query){const tt=tokens(text),qt=tokens(query);if(!qt.length)return{ok:true,score:0};let score=0;for(const q of qt){let best=Infinity,bonus=0;for(const t of tt){if(t.startsWith(q)){best=0;bonus=Math.max(bonus,2);break}if(t.includes(q)){best=Math.min(best,0);bonus=Math.max(bonus,1)}const d=lev(t,q);if(d<best)best=d}if(best<=1)score+=(2-best)+bonus;else return{ok:false,score:0}}return{ok:true,score}}
function safe(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function initCocoaBackground(){
  const bg=document.querySelector('.cocoa-bg');
  const canvas=bg?.querySelector('.cocoa-canvas');
  if(!bg||!canvas||canvas.dataset.ready)return;
  canvas.dataset.ready='1';
  const ctx=canvas.getContext('2d',{alpha:true,desynchronized:true});
  if(!ctx)return;

  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobile=()=>window.innerWidth<700;
  const rand=(a,b)=>Math.random()*(b-a)+a;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const TAU=Math.PI*2;
  let w=0,h=0,dpr=1,streams=[],ambient=[],sprites={beans:[],nibs:[],dust:[]};

  const palettes=[
    {hi:'#b66e3c',mid:'#7a3f21',lo:'#3a1b0e',line:'#241006',speck:'#d18a53'},
    {hi:'#a75f34',mid:'#6a351c',lo:'#31150b',line:'#1e0c05',speck:'#c47a46'},
    {hi:'#c07b48',mid:'#824825',lo:'#3d1e10',line:'#251007',speck:'#d79a66'},
    {hi:'#92502d',mid:'#5d2d18',lo:'#2c1209',line:'#1a0904',speck:'#b86a3b'}
  ];

  function beanPath(c,s){
    const W=c.width,H=c.height;
    c.beginPath();
    c.moveTo(W*.50,H*.06);
    c.bezierCurveTo(W*.78,H*.07,W*.93,H*.27,W*.85,H*.54);
    c.bezierCurveTo(W*.79,H*.77,W*.64,H*.92,W*.50,H*.95);
    c.bezierCurveTo(W*.30,H*.92,W*.14,H*.75,W*.17,H*.49);
    c.bezierCurveTo(W*.18,H*.26,W*.29,H*.09,W*.50,H*.06);
    c.closePath();
  }

  function makeBeanSprite(size,paletteIndex,variant){
    const scale=3;
    const sw=Math.round(size*1.08*scale),sh=Math.round(size*1.42*scale);
    const c=document.createElement('canvas');c.width=sw;c.height=sh;
    const x=c.getContext('2d');x.scale(scale,scale);
    const W=sw/scale,H=sh/scale,p=palettes[paletteIndex%palettes.length];
    x.save();
    x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=0;x.shadowOffsetX=size*.07;x.shadowOffsetY=size*.11;
    const g=x.createLinearGradient(W*.18,H*.10,W*.86,H*.86);
    g.addColorStop(0,p.hi);g.addColorStop(.38,p.mid);g.addColorStop(1,p.lo);
    beanPath(x);x.fillStyle=g;x.fill();x.restore();

    x.save();beanPath(x);x.clip();
    const edge=x.createRadialGradient(W*.34,H*.24,0,W*.48,H*.48,W*.58);
    edge.addColorStop(0,'rgba(255,230,197,.18)');edge.addColorStop(.38,'rgba(255,230,197,.035)');edge.addColorStop(1,'rgba(0,0,0,.22)');
    x.fillStyle=edge;x.fillRect(0,0,W,H);
    // Fine natural cacao texture, no blur.
    let seed=(variant+1)*97+paletteIndex*31;
    const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
    for(let i=0;i<Math.max(5,Math.round(size*.7));i++){
      const px=W*(.25+rnd()*.5),py=H*(.15+rnd()*.70),r=Math.max(.18,size*(.014+rnd()*.018));
      x.fillStyle=rnd()>.5?'rgba(244,196,146,.10)':'rgba(20,8,3,.12)';
      x.beginPath();x.arc(px,py,r,0,TAU);x.fill();
    }
    x.restore();

    // Characteristic cocoa-bean central groove.
    x.save();
    x.strokeStyle=p.line;x.lineWidth=Math.max(.65,size*.055);x.lineCap='round';
    x.beginPath();
    x.moveTo(W*.50,H*.14);
    x.bezierCurveTo(W*.39,H*.30,W*.61,H*.45,W*.47,H*.61);
    x.bezierCurveTo(W*.40,H*.70,W*.50,H*.79,W*.49,H*.87);
    x.stroke();
    x.strokeStyle='rgba(233,168,111,.17)';x.lineWidth=Math.max(.35,size*.020);
    x.beginPath();x.moveTo(W*.475,H*.15);x.bezierCurveTo(W*.385,H*.31,W*.585,H*.44,W*.455,H*.60);x.stroke();
    // Crisp highlight, no filter.
    x.fillStyle='rgba(255,224,189,.16)';
    x.beginPath();x.ellipse(W*.34,H*.27,W*.075,H*.15,-.48,0,TAU);x.fill();
    x.restore();
    return c;
  }

  function makeNibSprite(size,paletteIndex,variant){
    const scale=3,sw=Math.round(size*scale),sh=Math.round(size*.88*scale);
    const c=document.createElement('canvas');c.width=sw;c.height=sh;const x=c.getContext('2d');x.scale(scale,scale);
    const W=sw/scale,H=sh/scale,p=palettes[paletteIndex%palettes.length];
    const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,p.hi);g.addColorStop(.55,p.mid);g.addColorStop(1,p.lo);
    x.beginPath();x.moveTo(W*.08,H*.46);x.lineTo(W*.28,H*.07);x.lineTo(W*.78,H*.13);x.lineTo(W*.94,H*.56);x.lineTo(W*.62,H*.94);x.lineTo(W*.18,H*.82);x.closePath();x.fillStyle=g;x.fill();
    x.strokeStyle='rgba(32,13,6,.55)';x.lineWidth=Math.max(.45,size*.04);x.stroke();
    x.fillStyle='rgba(255,221,183,.13)';x.beginPath();x.moveTo(W*.25,H*.24);x.lineTo(W*.54,H*.17);x.lineTo(W*.44,H*.35);x.closePath();x.fill();
    return c;
  }

  function makeDustSprite(size,paletteIndex,variant){
    const scale=3,sw=Math.round(size*scale),sh=sw;
    const c=document.createElement('canvas');c.width=sw;c.height=sh;const x=c.getContext('2d');x.scale(scale,scale);
    const p=palettes[paletteIndex%palettes.length],W=sw/scale,H=W;
    let seed=(variant+11)*79+paletteIndex*23;
    const rnd=()=>{seed=(seed*1103515245+12345)>>>0;return seed/4294967296;};
    for(let i=0;i<6;i++){
      const r=Math.max(.28,size*(.055+rnd()*.045)),px=W*(.16+rnd()*.68),py=H*(.16+rnd()*.68);
      x.fillStyle=i%2?`${p.mid}cc`:`${p.hi}bb`;x.beginPath();x.arc(px,py,r,0,TAU);x.fill();
    }
    return c;
  }

  function buildSprites(){
    sprites={beans:[],nibs:[],dust:[]};
    const beanSizes=mobile()?[9,12,15,18]:[10,13,16,20,24];
    const nibSizes=mobile()?[5,7,9]:[5,7,9,11];
    const dustSizes=[5,7,9];
    beanSizes.forEach((s,si)=>palettes.forEach((_,pi)=>sprites.beans.push(makeBeanSprite(s,pi,si))));
    nibSizes.forEach((s,si)=>palettes.forEach((_,pi)=>sprites.nibs.push(makeNibSprite(s,pi,si))));
    dustSizes.forEach((s,si)=>palettes.forEach((_,pi)=>sprites.dust.push(makeDustSprite(s,pi,si))));
  }

  function makeStream(index){
    const fromLeft=Math.random()>.5;
    const direction=fromLeft?1:-1;
    const speed=rand(mobile()?.10:.12,mobile()?.22:.28)*(reduced?.35:1);
    const baseY=rand(h*.06,h*.94);
    const length=rand(mobile()?180:240,mobile()?340:520);
    const width=rand(mobile()?24:30,mobile()?58:78);
    const count=Math.round(rand(mobile()?36:52,mobile()?70:106));
    const items=[];
    for(let i=0;i<count;i++){
      const u=i/Math.max(1,count-1);
      const taper=Math.pow(Math.sin(Math.PI*u),.62);
      const coreBias=Math.pow(Math.random(),1.55);
      const side=(Math.random()*2-1)*width*(.16+.90*taper)*coreBias;
      const typeRoll=Math.random();
      const type=typeRoll<.63?'bean':(typeRoll<.88?'nib':'dust');
      const sizeTier=Math.random();
      const spritePool=sprites[type==='bean'?'beans':type==='nib'?'nibs':'dust'];
      const sprite=spritePool[(Math.random()*spritePool.length)|0];
      items.push({
        u,
        along:u*length+rand(-8,8),
        side,
        type,
        sprite,
        scale:(type==='bean'?rand(.54,1.08):rand(.62,1.10))*(.72+.55*taper)*(sizeTier>.92?1.22:1),
        alpha:(type==='bean'?rand(.20,.42):type==='nib'?rand(.16,.34):rand(.10,.22))*(.48+.68*taper),
        rot:rand(0,TAU),
        spin:rand(-.00020,.00020),
        phase:rand(0,TAU),
        lift:rand(.65,1.35)
      });
    }
    return {
      x:fromLeft?rand(-length,w*.8):rand(w*.2,w+length),
      y:baseY,direction,speed,length,width,items,
      angle:rand(-.09,.09)+(direction<0?Math.PI:0),
      waveAmp:rand(5,15),waveFreq:rand(.00028,.00062),phase:rand(0,TAU),
      verticalAmp:rand(8,24),verticalFreq:rand(.00012,.00026),index
    };
  }

  function makeAmbient(){
    const pool=sprites.dust.concat(sprites.nibs.slice(0,Math.max(4,(sprites.nibs.length/2)|0)));
    return {x:rand(0,w),y:rand(0,h),vx:rand(-.014,.014),vy:rand(-.010,.010),sprite:pool[(Math.random()*pool.length)|0],scale:rand(.45,.78),alpha:rand(.045,.105),rot:rand(0,TAU),spin:rand(-.00012,.00012)};
  }

  function buildScene(){
    buildSprites();streams=[];ambient=[];
    const streamCount=mobile()?18:26;
    for(let i=0;i<streamCount;i++)streams.push(makeStream(i));
    const ambientCount=mobile()?55:90;
    for(let i=0;i<ambientCount;i++)ambient.push(makeAmbient());
  }

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2.35);
    w=window.innerWidth;h=window.innerHeight;
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildScene();
  }

  function drawSprite(sprite,x,y,scale,rot,alpha){
    const W=(sprite.width/3)*scale,H=(sprite.height/3)*scale;
    if(x<-W*1.5||x>w+W*1.5||y<-H*1.5||y>h+H*1.5)return;
    ctx.save();ctx.globalAlpha=clamp(alpha,0,1);ctx.translate(x,y);ctx.rotate(rot);ctx.drawImage(sprite,-W/2,-H/2,W,H);ctx.restore();
  }

  function updateAndDrawAmbient(){
    for(const a of ambient){
      a.x+=a.vx;a.y+=a.vy;a.rot+=a.spin;
      if(a.x<-10)a.x=w+10;if(a.x>w+10)a.x=-10;if(a.y<-10)a.y=h+10;if(a.y>h+10)a.y=-10;
      drawSprite(a.sprite,a.x,a.y,a.scale,a.rot,a.alpha);
    }
  }

  function updateAndDrawStreams(t){
    for(const s of streams){
      const cos=Math.cos(s.angle),sin=Math.sin(s.angle);
      s.x+=cos*s.speed;
      s.y+=sin*s.speed*.28 + Math.sin(t*s.verticalFreq+s.phase)*.010;
      const lead=s.x,baseY=s.y+Math.sin(t*s.verticalFreq+s.phase)*s.verticalAmp;
      for(let i=0;i<s.items.length;i++){
        const p=s.items[i];
        const localWave=Math.sin(t*s.waveFreq+p.phase+i*.115)*s.waveAmp*p.lift;
        const x=lead-cos*p.along-sin*(p.side+localWave);
        const y=baseY-sin*p.along+cos*(p.side*.42+localWave*.22);
        const depthPulse=.96+Math.sin(t*.00014+p.phase)*.04;
        drawSprite(p.sprite,x,y,p.scale*depthPulse,p.rot+t*p.spin,p.alpha);
      }
      const margin=s.length+180;
      if(s.direction>0&&s.x-margin>w+120){Object.assign(s,makeStream(s.index),{x:-120});}
      if(s.direction<0&&s.x+margin<-120){Object.assign(s,makeStream(s.index),{x:w+120});}
      if(s.y<-60)s.y=h+60;if(s.y>h+60)s.y=-60;
    }
  }

  function frame(t){
    ctx.clearRect(0,0,w,h);
    updateAndDrawAmbient();
    updateAndDrawStreams(t);
    requestAnimationFrame(frame);
  }

  resize();requestAnimationFrame(frame);
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,140)},{passive:true});
}
initCocoaBackground();
applyFilters();</script></body></html>
